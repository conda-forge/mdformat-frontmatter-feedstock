schema_version: 1

context:
  name: mdformat-frontmatter
  version: 2.2.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/mdformat_frontmatter-${{ version }}.tar.gz
  sha256: 5559bfeb187354ab1dfba81fb85af3f9dda44fd38a893a842761564b9394bb6a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - mdformat >=1.0.0
    - mdit-py-plugins >=0.6.1
    - ruamel.yaml >=0.19.1
    - ruamel_yaml >=0.19.1
tests:
  - python:
      imports:
        - mdformat_frontmatter
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: An mdformat plugin for parsing / ignoring frontmatter.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/butler54/mdformat-frontmatter
  repository: https://github.com/butler54/mdformat-frontmatter

extra:
  recipe-maintainers:
    - xylar
